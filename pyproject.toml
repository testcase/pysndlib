[project]
name = "pysndlib"
version = "0.8.0"
authors = [
  { name="Todd Ingalls", email="testcase@asu.edu" },
]
description = "A python wrapper around sndlib"
dependencies = ["numpy", "Cython>=3.0.5"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: Mac OS X",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
"Homepage" = "https://github.com/testcase/pysndlib"
"Bug Tracker" = "https://github.com/testcase/pysndlib/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["test"]

[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0.5", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


